<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="aurora" cx="20%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#a02a22" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#fc6b2f" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="auroraCyan" cx="85%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fc6b2f" />
      <stop offset="100%" stop-color="#a02a22" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Void Background -->
  <rect width="1200" height="630" fill="#050505" />
  <rect width="1200" height="630" fill="url(#aurora)" />
  <rect width="1200" height="630" fill="url(#auroraCyan)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Outer Glass Frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#0c0d12" fill-opacity="0.7" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <rect x="42" y="42" width="1116" height="546" rx="22" fill="none" stroke="url(#emberGrad)" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Status Pill -->
  <g transform="translate(80, 80)">
    <rect width="260" height="36" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <circle cx="18" cy="18" r="4.5" fill="#fc6b2f" />
    <text x="32" y="23" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="700" fill="#e8e8ea" letter-spacing="2">SHIPPING IDEAS INTO REALITY</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="225" font-family="'Space Grotesk', system-ui, sans-serif" font-size="84" font-weight="900" fill="#ffffff" letter-spacing="-1">
    DEV JANGID
  </text>

  <!-- Subtitle -->
  <text x="80" y="285" font-family="'Space Grotesk', system-ui, sans-serif" font-size="32" font-weight="700" fill="url(#emberGrad)" letter-spacing="1">
    COMPUTER SCIENCE ENGINEER
  </text>

  <!-- Summary statement -->
  <text x="80" y="355" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#b0b0b3">
    Airports Authority of India (AAI) • India Space Lab (ISL) • Multimodal GenAI
  </text>
  <text x="80" y="395" font-family="'JetBrains Mono', monospace" font-size="18" fill="#8a8a8d">
    Faridabad, India • jangid.dev20@gmail.com • dev-jangid-portfolio.vercel.app
  </text>

  <!-- Verified Badges -->
  <g transform="translate(80, 460)">
    <rect width="140" height="32" rx="16" fill="rgba(160,42,34,0.2)" stroke="rgba(252,107,47,0.4)" stroke-width="1" />
    <text x="70" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fc6b2f" text-anchor="middle">AAI VERIFIED</text>
  </g>
  <g transform="translate(235, 460)">
    <rect width="150" height="32" rx="16" fill="rgba(34,211,238,0.15)" stroke="rgba(34,211,238,0.35)" stroke-width="1" />
    <text x="75" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">CANSAT TELEMETRY</text>
  </g>
  <g transform="translate(400, 460)">
    <rect width="145" height="32" rx="16" fill="rgba(245,158,11,0.15)" stroke="rgba(245,158,11,0.35)" stroke-width="1" />
    <text x="72.5" y="21" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">GEMINI RAG AI</text>
  </g>

  <!-- Brand Monogram Box on Right Side -->
  <g transform="translate(860, 150)">
    <rect width="220" height="220" rx="36" fill="#12131a" stroke="rgba(255,255,255,0.14)" stroke-width="3" />
    <rect x="4" y="4" width="212" height="212" rx="32" fill="none" stroke="rgba(252,107,47,0.25)" stroke-width="2" />
    <text x="70" y="145" font-family="'Space Grotesk', system-ui, sans-serif" font-size="105" font-weight="900" fill="url(#emberGrad)" letter-spacing="-4">D</text>
    <text x="135" y="145" font-family="'Space Grotesk', system-ui, sans-serif" font-size="105" font-weight="900" fill="#ffffff" letter-spacing="-4">J</text>
    <circle cx="185" cy="138" r="9" fill="#fc6b2f" />
  </g>
</svg>
